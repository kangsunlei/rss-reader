        <h2>HTML 内嵌 LLM 指令提案 (基于 llms.txt) - Vercel</h2>
        <p>8/20/2025, 1:00:00 PM</p>
        <p><div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; max-width: 100%; margin: 0px auto; color: rgb(30, 41, 59); padding: 20px 0px;">
        <div style="margin: 30px 0px; padding: 20px; background-color: rgb(255, 255, 255); border-radius: 8px; border-left: 4px solid #2563eb;">
            <h3 style="color: rgb(30, 64, 175); margin: 0px 0px 12px 0px; font-size: 1.2em; display: flex; align-items: center;">
                <span style="color: #2563eb; margin-right: 8px">📌</span> 一句话摘要
            </h3>
            <p style="margin: 0; line-height: 1.8; color: #334155">该提案建议使用 `<script type="text/llms.txt">` 标签在 HTML 中嵌入 LLM 指令，以指导 AI 代理访问受保护的网页。</p>
        </div>
<div style="margin: 30px 0; padding: 20px; background-color: #f8fafc; border-radius: 8px; border-left: 4px solid #2563eb;">
            <h3 style="color: #1e40af; margin: 0 0 12px 0; font-size: 16px; display: flex; align-items: center;">
                <span style="color: #2563eb; margin-right: 8px">📝</span> 详细摘要
            </h3>
            <p style="margin: 0; line-height: 1.8; color: #334155">本文提出一种创新且实用的方法，用于直接在 HTML 响应中为 AI 代理提供指令，尤其适用于受保护的网页。Vercel 基于新兴的 `llms.txt` 标准，建议使用 `<script type="text/llms.txt">` 标签嵌入指令。此方法巧妙地利用了 Web 浏览器会忽略未知类型脚本元素的特性，确保嵌入内容不影响页面呈现和用户体验。同时，大型语言模型 (LLM) 和 AI 代理被设计为解析和理解此类内容，从而发现并执行内联指令。Vercel 在其 401 身份验证页面上展示了一个实际用例，其中指令指导代理如何使用特定机制绕过身份验证来访问受保护的部署。此方法无需外部文档或繁琐的预配置，显著简化了代理交互。该提案强调这是一种灵活的约定，而非正式标准，支持立即采纳和更广泛的应用，不仅限于身份验证，还包括管理控制面板 (MCP) 发现或错误页面指导，从而促进对操作指令的更无缝和上下文感知的发现，以便更好地浏览复杂的 Web 环境。</p>
        </div>
<div style="margin: 30px 0; padding: 20px; background-color: #f8fafc; border-radius: 8px; border-left: 4px solid #2563eb;">
            <h3 style="color: #1e40af; margin: 0 0 12px 0; font-size: 16px; display: flex; align-items: center;">
                <span style="color: #2563eb; margin-right: 8px">💡</span> 主要观点
            </h3>
            <ol style="margin: 0; padding-left: 20px; color: #334155">
                <li style="margin: 12px 0; line-height: 1.8;">
                        <strong style="color: #1e40af">内联 LLM 指令简化了代理指导，增强了可发现性。</strong>
                        <span style="color: #64748b; display: block; margin-top: 6px; padding-left: 20px; border-left: 2px solid #e2e8f0"> 通过 `<script type="text/llms.txt">` 将指令直接嵌入 HTML，无需依赖外部文档，从而提高代理交互的效率和上下文感知能力。</span>
                    </li><li style="margin: 12px 0; line-height: 1.8;">
                        <strong style="color: #1e40af">利用 `<script>` 标签确保浏览器兼容性的同时，通知 LLM。</strong>
                        <span style="color: #64748b; display: block; margin-top: 6px; padding-left: 20px; border-left: 2px solid #e2e8f0"> 在 `<script>` 标签中使用未知的 `type` 属性，浏览器会忽略内容，而 LLM 仍然可以解析，确保不影响用户体验或页面呈现。</span>
                    </li><li style="margin: 12px 0; line-height: 1.8;">
                        <strong style="color: #1e40af">促进 AI 代理无缝访问受保护内容。</strong>
                        <span style="color: #64748b; display: block; margin-top: 6px; padding-left: 20px; border-left: 2px solid #e2e8f0"> 该方法为 AI 代理提供了一种直接且易于发现的机制，使其了解如何绕过身份验证或解决特定于站点的挑战，从而提高自动化能力。</span>
                    </li><li style="margin: 12px 0; line-height: 1.8;">
                        <strong style="color: #1e40af">该提案是一种灵活的约定，而非正式标准，因此可以立即采用。</strong>
                        <span style="color: #64748b; display: block; margin-top: 6px; padding-left: 20px; border-left: 2px solid #e2e8f0"> 其快速发现机制允许开发人员在无需与 LLM 提供商协调的情况下实施，从而促进快速集成和创新。</span>
                    </li>
            </ol>
        </div>
<div style="margin: 30px 0; padding: 20px; background-color: #f8fafc; border-radius: 8px; border-left: 4px solid #2563eb;">
            <h3 style="color: #1e40af; margin: 0 0 12px 0; font-size: 16px; display: flex; align-items: center;">
                <span style="color: #2563eb; margin-right: 8px">💬</span> 文章金句
            </h3>
            <ul style="margin: 0; padding-left: 20px; list-style-type: none; color: #334155">
                <li style="margin: 12px 0; padding-left: 20px; border-left: 2px solid #e2e8f0; font-style: italic; line-height: 1.8;">如果指令直接存在于 HTML 响应中会怎样？</li><li style="margin: 12px 0; padding-left: 20px; border-left: 2px solid #e2e8f0; font-style: italic; line-height: 1.8;">llms.txt 是一种新兴标准，旨在使文档等内容可供 AI 直接使用。</li><li style="margin: 12px 0; padding-left: 20px; border-left: 2px solid #e2e8f0; font-style: italic; line-height: 1.8;">浏览器会忽略具有未知类型的脚本元素，确保内容不影响常规浏览器中的呈现。</li><li style="margin: 12px 0; padding-left: 20px; border-left: 2px solid #e2e8f0; font-style: italic; line-height: 1.8;">脚本元素在 `<head>` 中是合法的，因此可以放置在文档顶部附近，LLM 很可能首先注意到它们。</li><li style="margin: 12px 0; padding-left: 20px; border-left: 2px solid #e2e8f0; font-style: italic; line-height: 1.8;">`<script type="text/llms.txt">` 不需要是正式标准，建议您立即开始使用。</li>
            </ul>
