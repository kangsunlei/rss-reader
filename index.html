
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>文章目录</title>
        <style>
            body {
                padding: 12px;
                line-height: 1.8;
                margin: 0;
            }

            ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            ul li {
                display: inline-block;
                padding: 0 10px;
                font-size: 1em;
            }

            ul li.active {
                border-bottom: 2px solid #000;
            }

            ol {
                display: none;
                padding-left: 2em;
            }

            ol.show {
                display: block;
            }
        </style>
    </head>
    <body>
        <ul>
        <li onclick="titleClicked(0)">精选</li><li onclick="titleClicked(1)">软件编程</li><li onclick="titleClicked(2)">产品设计</li><li onclick="titleClicked(3)">商业</li>
        </ul>

            </ol>
        
            <ol>
                
            </ol>
        
    </body>
    <script>
        var categoryQueryKey = 'category';
        var hashQuery = location.hash.split('?')[1];
        var params = hashQuery ? hashQuery.split('&').map(function (param) {
            return param.split('=');
        }) : [];

        var category = 0;
        var queryIndex = undefined;
        for (var index = 0; index < params.length; index++) {
            if (params[index][0] === categoryQueryKey) {
                category = parseInt(params[index][1]);
                queryIndex = index;
                break;
            }
        }
        var lastShowIndex = category;
        var titles = document.querySelectorAll('ul li');
        var olList = document.querySelectorAll('ol');

        function titleClicked(index) {
            olList[lastShowIndex].classList.remove('show');
            olList[index].classList.add('show');

            titles[lastShowIndex].classList.remove('active');
            titles[index].classList.add('active');
            lastShowIndex = index;

            if (queryIndex !== undefined) {
                params[queryIndex][1] = index;
            } else {
                params.push([categoryQueryKey, index]);
                queryIndex = params.length - 1;
            }
            location.hash = '#?' + params.map(function (param) {
                return param.join('=');
            }).join('&');
        }

        titleClicked(lastShowIndex);

        document.body.style.fontSize = Math.max(window.document.body.clientWidth / 30, 14) + 'px';
    </script>
    </html>
